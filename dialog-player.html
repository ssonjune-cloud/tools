<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dialog Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap');

  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface2: #22222a;
    --border: #2e2e38;
    --shu: #7eb8f7;
    --shu-dim: rgba(126,184,247,0.12);
    --maya: #f7a87e;
    --maya-dim: rgba(247,168,126,0.12);
    --text: #e8e8f0;
    --muted: #666676;
    --accent: #c8f76e;
    --accent-dim: rgba(200,247,110,0.10);
    --error: #f77e7e;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 16px 20px 0;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 1.4rem;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  header span {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #edit-btn {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 12px;
    cursor: pointer;
    display: none;
  }
  #edit-btn.visible { display: block; }

  #api-key-section {
    margin: 12px 16px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
    flex-shrink: 0;
  }
  #api-key-section:focus-within { border-color: var(--accent); }
  #api-key-section.valid { border-color: rgba(200,247,110,0.4); }
  #api-key-section.error { border-color: var(--error); }

  .api-key-inner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
  }
  .api-key-label {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #api-key-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    min-width: 0;
  }
  #api-key-status { font-size: 0.65rem; flex-shrink: 0; }

  .api-key-save-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px 8px;
    border-top: 1px solid var(--border);
  }
  .api-key-save-row label {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
  }
  #save-key-checkbox { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }
  .save-key-note { font-size: 0.58rem; color: var(--muted); margin-left: auto; opacity: 0.6; }

  #input-section {
    margin: 10px 16px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
    flex-shrink: 0;
  }
  #input-section:focus-within { border-color: var(--accent); }

  #input-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px 7px;
    border-bottom: 1px solid var(--border);
  }
  #input-label span {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    line-height: 1.7;
    padding: 10px 14px;
    resize: none;
    min-height: 90px;
  }
  textarea::placeholder { color: var(--muted); }

  #cache-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-top: 1px solid var(--border);
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.06em;
  }
  #cache-info { flex: 1; }
  #cache-clear {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 10px;
    cursor: pointer;
  }

  #load-btn {
    display: block;
    width: calc(100% - 32px);
    margin: 8px 16px 10px;
    padding: 13px;
    background: var(--accent);
    color: #0f0f11;
    border: none;
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  #load-btn:active { opacity: 0.8; transform: scale(0.98); }
  #load-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #voice-settings {
    margin: 0 16px 8px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex-shrink: 0;
  }
  .voice-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }
  .voice-card.shu { border-left: 3px solid var(--shu); }
  .voice-card.maya { border-left: 3px solid var(--maya); }
  .voice-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .voice-card.shu .voice-label { color: var(--shu); }
  .voice-card.maya .voice-label { color: var(--maya); }
  select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    padding: 6px 8px;
    outline: none;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .rate-row { display: flex; align-items: center; gap: 8px; }
  .rate-row span { font-size: 0.65rem; color: var(--muted); }
  .rate-row input[type=range] {
    flex: 1; height: 3px;
    -webkit-appearance: none;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  .voice-card.shu .rate-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: var(--shu); border-radius: 50%; cursor: pointer;
  }
  .voice-card.maya .rate-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: var(--maya); border-radius: 50%; cursor: pointer;
  }
  .rate-val { min-width: 28px; font-size: 0.65rem; color: var(--muted); text-align: right; }

  #controls {
    margin: 0; background: transparent; border: none; padding: 0;
    display: flex; flex-direction: column; gap: 10px;
  }
  .ctrl-row {
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .btn-icon {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn-icon:active { transform: scale(0.92); }
  .btn-icon svg { width: 18px; height: 18px; }
  .btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }

  #play-btn {
    width: 60px; height: 60px;
    background: var(--accent); border-color: transparent; color: #0f0f11;
  }
  #play-btn svg { width: 24px; height: 24px; }
  #play-btn.loading {
    background: var(--surface2); border-color: var(--border); color: var(--text);
    animation: pulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

  .toggle-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .toggle-btn.on { background: var(--accent); border-color: transparent; color: #0f0f11; }
  #role-btn.on.shu  { background: var(--shu); }
  #role-btn.on.maya { background: var(--maya); }

  .ctrl-row-small {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  .pause-row {
    display: flex; align-items: center; gap: 10px; justify-content: center;
  }
  .pause-row label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .pause-row input[type=range] {
    width: 100px; height: 3px;
    -webkit-appearance: none; background: var(--border); border-radius: 2px; outline: none;
  }
  .pause-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: var(--accent); border-radius: 50%; cursor: pointer;
  }
  .pause-val { font-size: 0.65rem; color: var(--muted); min-width: 28px; }

  /* ─── Scrollable turn area ─── */
  #turn-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 16px 16px;
    min-height: 0;
  }

  #turn-list { display: flex; flex-direction: column; gap: 8px; }

  #bottom-panel {
    flex-shrink: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 10px 16px max(16px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    max-height: 55dvh;
  }

  /* ─── Turn card ─── */
  .turn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }
  .turn:active { opacity: 0.85; }
  .turn.shu { border-left: 3px solid var(--shu); }
  .turn.maya { border-left: 3px solid var(--maya); }
  .turn.playing.shu { background: var(--shu-dim); border-color: var(--shu); }
  .turn.playing.maya { background: var(--maya-dim); border-color: var(--maya); }
  .turn.playing.yours-now { background: var(--accent-dim); border-color: var(--accent); }

  .turn-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .turn-speaker {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .turn.shu .turn-speaker { color: var(--shu); }
  .turn.maya .turn-speaker { color: var(--maya); }
  .you-tag {
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .speak-now {
    display: none;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .turn.playing.yours-now .speak-now { display: inline; }
  .turn-num { font-size: 0.6rem; color: var(--muted); margin-left: auto; }

  .turn-text {
    font-size: 0.85rem;
    line-height: 1.75;
    color: var(--text);
    word-break: break-word;
    white-space: pre-wrap;
    padding-bottom: 2px;
  }

  .turn-footer {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 24px;
  }
  .dl-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(200,247,110,0.06);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    cursor: default;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    text-decoration: none;
    flex-shrink: 0;
    opacity: 0.4;
    pointer-events: none;
  }
  .dl-btn.ready {
    background: rgba(200,247,110,0.15);
    border-color: var(--accent);
    color: var(--accent);
    opacity: 1;
    cursor: pointer;
    pointer-events: auto;
  }
  .dl-btn.ready:active { background: rgba(200,247,110,0.3); }

  .playing-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    background: var(--accent);
    width: 0%;
  }
  .turn:not(.playing) .playing-bar { width: 0% !important; }

  #status-bar {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.65rem; color: var(--muted); letter-spacing: 0.06em;
  }
  #status-countdown {
    font-size: 0.9rem; color: var(--text); letter-spacing: 0.04em; transition: color 0.3s;
  }
  #status-countdown.near-end { color: var(--maya); }
  #status-total { font-size: 0.6rem; color: var(--muted); }

  #empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; padding: 40px 20px; color: var(--muted);
  }
  #empty-state .big { font-size: 2.5rem; }
  #empty-state p { font-size: 0.72rem; text-align: center; line-height: 1.8; }

  #player-section { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
  #player-section.visible { display: flex; }

  #dl-all-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
  }
  #dl-all-btn:hover { border-color: var(--accent); color: var(--accent); }
  #dl-all-btn:active { opacity: 0.7; }
  #dl-all-btn.loading {
    border-color: var(--accent);
    color: var(--accent);
    opacity: 0.6;
    cursor: not-allowed;
  }
  #dl-all-progress {
    font-size: 0.6rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>Dialog Player</h1>
  <span>shadowing / listening</span>
  <button id="edit-btn">Edit</button>
</header>

<div id="api-key-section">
  <div class="api-key-inner">
    <span class="api-key-label">OpenAI Key</span>
    <input type="password" id="api-key-input" placeholder="sk-..." autocomplete="off" spellcheck="false">
    <span id="api-key-status">—</span>
  </div>
  <div class="api-key-save-row">
    <input type="checkbox" id="save-key-checkbox">
    <label for="save-key-checkbox">Save key</label>
    <span class="save-key-note">stored in browser only</span>
  </div>
</div>

<div id="input-section">
  <div id="input-label">
    <span>Paste dialog</span>
    <span id="turn-count-label"></span>
  </div>
  <textarea id="dialog-input" placeholder="Shu: Hello, how's it going?&#10;Maya: Pretty good! I just finished the report.&#10;Shu: Oh nice, when did you finish it?"></textarea>
  <div id="cache-row">
    <span id="cache-info">Saved audio: —</span>
    <button id="cache-clear">Clear</button>
  </div>
</div>
<button id="load-btn">Load Dialog ↓</button>

<div id="player-section">

  <div id="voice-settings">
    <div class="voice-card shu">
      <div class="voice-label">Shu</div>
      <select id="shu-voice">
        <option value="onyx">onyx</option>
        <option value="echo">echo</option>
        <option value="fable">fable</option>
        <option value="alloy">alloy</option>
        <option value="nova">nova</option>
        <option value="shimmer">shimmer</option>
      </select>
      <div class="rate-row">
        <span>Speed</span>
        <input type="range" id="shu-rate" min="0.5" max="1.5" step="0.05" value="0.9">
        <span class="rate-val" id="shu-rate-val">0.90×</span>
      </div>
    </div>
    <div class="voice-card maya">
      <div class="voice-label">Maya</div>
      <select id="maya-voice">
        <option value="shimmer">shimmer</option>
        <option value="nova">nova</option>
        <option value="alloy">alloy</option>
        <option value="fable">fable</option>
        <option value="echo">echo</option>
        <option value="onyx">onyx</option>
      </select>
      <div class="rate-row">
        <span>Speed</span>
        <input type="range" id="maya-rate" min="0.5" max="1.5" step="0.05" value="0.9">
        <span class="rate-val" id="maya-rate-val">0.90×</span>
      </div>
    </div>
  </div>

  <div id="turn-scroll">
    <div id="turn-list"></div>
  </div>

  <div id="bottom-panel">
    <div id="status-bar">
      <span id="status-left">—</span>
      <span id="status-countdown">—</span>
      <span id="status-total"></span>
    </div>
    <div id="controls">
      <div class="ctrl-row">
        <button class="btn-icon" id="prev-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="btn-icon" id="play-btn">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <svg id="loading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="10" stroke-dasharray="40" stroke-dashoffset="10"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/></circle></svg>
        </button>
        <button class="btn-icon" id="next-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="ctrl-row-small">
        <button class="toggle-btn" id="repeat-btn">Repeat ×1</button>
        <button class="toggle-btn" id="auto-btn">Auto</button>
        <button class="toggle-btn" id="hide-btn">Show text</button>
        <button class="toggle-btn" id="role-btn">Role: off</button>
      </div>
      <div class="pause-row">
        <label>Pause</label>
        <input type="range" id="pause-slider" min="0" max="4" step="0.5" value="1">
        <span class="pause-val" id="pause-val">1.0s</span>
      </div>
    </div>
    <button id="dl-all-btn">
      ↓ Download all · WAV (1.0×) <span id="dl-all-progress"></span>
    </button>
  </div>

</div>

<div id="empty-state">
  <div class="big">🎧</div>
  <p>Paste your Shu / Maya dialog<br>and tap <strong>Load Dialog</strong>.<br>The API key is only needed for new audio.</p>
</div>

<script>
// ═══════════════════════════════════════════
//  Settings
// ═══════════════════════════════════════════
const MODEL = 'tts-1';
const ROLE_FACTOR = 1.2;   // your silence = original length × 1.2
const ROLE_MIN = 1.5;      // at least 1.5 s
const DECODE_SR = 24000;   // tts-1 outputs 24 kHz

// ═══════════════════════════════════════════
//  State
// ═══════════════════════════════════════════
let turns = [];
let currentIdx = 0;
let running = false;      // playback chain in progress (incl. loading / gaps)
let finished = false;
let repeatMode = 1;
let autoPlay = false;
let hideText = false;
let pauseInterval = 1.0;
let role = null;          // null | 'Shu' | 'Maya'

let runId = 0;
let cancelSeg = null;
let segment = null;       // { kind: 'turn' | 'yours' | 'gap', idx }
let ignorePauseUntil = 0;
let unlocked = false;

let totalEstSec = 0;
let remainSec = 0;
let countdownTimer = null;
let countdownRunning = false;
let turnRemainCache = [];

const $ = id => document.getElementById(id);
const player = new Audio();
player.preload = 'auto';

// ═══════════════════════════════════════════
//  API key
// ═══════════════════════════════════════════
let apiKey = localStorage.getItem('oai_key') || sessionStorage.getItem('oai_key') || '';

const keyInput = $('api-key-input');
const keyStatus = $('api-key-status');
const keySection = $('api-key-section');
const saveKeyCheckbox = $('save-key-checkbox');

saveKeyCheckbox.checked = !!localStorage.getItem('oai_key');

if (apiKey) {
  keyInput.value = apiKey;
  keyStatus.textContent = '✓';
  keySection.classList.add('valid');
}

keyInput.addEventListener('input', e => {
  apiKey = e.target.value.trim();
  persistKey();
  if (apiKey.startsWith('sk-') && apiKey.length > 20) {
    keyStatus.textContent = '✓';
    keySection.classList.remove('error');
    keySection.classList.add('valid');
  } else {
    keyStatus.textContent = '—';
    keySection.classList.remove('valid', 'error');
  }
});

saveKeyCheckbox.addEventListener('change', () => {
  persistKey();
  if (!saveKeyCheckbox.checked) localStorage.removeItem('oai_key');
});

function persistKey() {
  if (saveKeyCheckbox.checked) {
    localStorage.setItem('oai_key', apiKey);
    sessionStorage.removeItem('oai_key');
  } else {
    sessionStorage.setItem('oai_key', apiKey);
    localStorage.removeItem('oai_key');
  }
}

// ═══════════════════════════════════════════
//  Persistent audio cache (IndexedDB)
//  Key = model | voice | text  → same sentence is never paid for twice
//  Audio is generated at 1.0×; speed is applied at playback
// ═══════════════════════════════════════════
let dbPromise = null;
function openDB() {
  if (!dbPromise) {
    dbPromise = new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('IndexedDB unavailable'));
      const r = indexedDB.open('dialog-player', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('clips');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  return dbPromise;
}
async function idbReq(mode, fn) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction('clips', mode);
    const r = fn(t.objectStore('clips'));
    t.oncomplete = () => res(r ? r.result : undefined);
    t.onerror = t.onabort = () => rej(t.error);
  });
}
const idbGet   = k => idbReq('readonly',  s => s.get(k));
const idbCount = k => idbReq('readonly',  s => s.count(k));
const idbPut   = (k, v) => idbReq('readwrite', s => s.put(v, k));
const idbClear = () => idbReq('readwrite', s => s.clear());
async function idbStats() {
  const db = await openDB();
  return new Promise((res, rej) => {
    let n = 0, bytes = 0;
    const t = db.transaction('clips', 'readonly');
    const c = t.objectStore('clips').openCursor();
    c.onsuccess = () => {
      const cur = c.result;
      if (cur) { n++; bytes += (cur.value && cur.value.buf) ? cur.value.buf.byteLength : 0; cur.continue(); }
    };
    t.oncomplete = () => res({ n, bytes });
    t.onerror = () => rej(t.error);
  });
}

let persistAsked = false;
async function askPersist() {
  if (persistAsked) return;
  persistAsked = true;
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
}

const mem = new Map();       // key → { url, dur, buf }
const inflight = new Map();  // key → Promise

const who = t => t.speaker.toLowerCase();
const clipKey = t => `${MODEL}|${getVoice(who(t))}|${t.text}`;
const isMine = i => !!role && turns[i] && turns[i].speaker === role;

async function fetchTTS(text, voice) {
  const res = await fetch('https://api.openai.com/v1/audio/speech', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: MODEL, input: text, voice })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${res.status}`);
  }
  return await res.arrayBuffer();
}

let decodeCtx = null;
function decodeBuf(buf) {
  const C = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!decodeCtx) decodeCtx = new C(1, 1, DECODE_SR);
  return new Promise((res, rej) => {
    const p = decodeCtx.decodeAudioData(buf.slice(0), res, rej);
    if (p && p.catch) p.catch(rej);
  });
}

function wordEstimate(text) {
  return text.trim().split(/\s+/).length / 150 * 60;
}

function getClip(t) {
  const key = clipKey(t);
  if (mem.has(key)) return Promise.resolve(mem.get(key));
  if (inflight.has(key)) return inflight.get(key);
  const voice = getVoice(who(t));
  const p = (async () => {
    let rec = null;
    try { rec = await idbGet(key); } catch (e) {}
    if (!rec) {
      if (!apiKey) throw new Error('API key needed for new audio');
      const buf = await fetchTTS(t.text, voice);
      let dur;
      try { dur = (await decodeBuf(buf)).duration; } catch (e) { dur = wordEstimate(t.text); }
      rec = { buf, dur, created: Date.now() };
      idbPut(key, rec).then(() => { askPersist(); updateCacheInfo(); }).catch(() => {});
    }
    const url = URL.createObjectURL(new Blob([rec.buf], { type: 'audio/mpeg' }));
    const clip = { url, dur: rec.dur, buf: rec.buf };
    mem.set(key, clip);
    return clip;
  })();
  inflight.set(key, p);
  p.finally(() => inflight.delete(key)).catch(() => {});
  return p;
}

// Load already-saved clips for the current dialog (local only, no API calls)
async function warmFromDB() {
  for (const t of turns) {
    const key = clipKey(t);
    if (mem.has(key)) continue;
    try { if (await idbCount(key)) await getClip(t); } catch (e) {}
  }
  refreshDownloadButtons();
  recalc();
}

async function updateCacheInfo() {
  const el = $('cache-info');
  try {
    const { n, bytes } = await idbStats();
    el.textContent = `Saved audio: ${n} clips · ${(bytes / 1048576).toFixed(1)} MB`;
  } catch (e) {
    el.textContent = 'Saved audio: unavailable (private mode?)';
  }
}

$('cache-clear').addEventListener('click', async () => {
  if (!confirm('Delete all saved audio?\n(It will be regenerated via the API when played.)')) return;
  halt(); setPlayState('stopped');
  try { await idbClear(); } catch (e) {}
  mem.forEach(c => URL.revokeObjectURL(c.url));
  mem.clear();
  refreshDownloadButtons();
  updateCacheInfo();
});

// ═══════════════════════════════════════════
//  Silence (for gaps and your turns, played on the same player)
// ═══════════════════════════════════════════
function writeStr(v, o, s) { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
function writeWavHeader(v, frames, sr) {
  const bytes = frames * 2;
  writeStr(v, 0, 'RIFF'); v.setUint32(4, 36 + bytes, true);
  writeStr(v, 8, 'WAVE'); writeStr(v, 12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  writeStr(v, 36, 'data'); v.setUint32(40, bytes, true);
}
const silenceUrls = new Map();
function silenceUrl(sec) {
  const s = Math.max(0.1, Math.round(sec * 10) / 10);
  if (silenceUrls.has(s)) return silenceUrls.get(s);
  const sr = 8000, n = Math.round(s * sr);
  const buf = new ArrayBuffer(44 + n * 2);
  writeWavHeader(new DataView(buf), n, sr);
  const url = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  silenceUrls.set(s, url);
  return url;
}

// ═══════════════════════════════════════════
//  Settings persistence (voices, speeds, pause) + last dialog
// ═══════════════════════════════════════════
function saveSettings() {
  try {
    localStorage.setItem('dp_settings', JSON.stringify({
      shuVoice: getVoice('shu'), mayaVoice: getVoice('maya'),
      shuRate: getRate('shu'), mayaRate: getRate('maya'),
      pause: pauseInterval
    }));
  } catch (e) {}
}
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('dp_settings') || 'null');
    if (s) {
      if (s.shuVoice) $('shu-voice').value = s.shuVoice;
      if (s.mayaVoice) $('maya-voice').value = s.mayaVoice;
      if (s.shuRate) $('shu-rate').value = s.shuRate;
      if (s.mayaRate) $('maya-rate').value = s.mayaRate;
      if (typeof s.pause === 'number') { $('pause-slider').value = s.pause; pauseInterval = s.pause; }
    }
    const d = localStorage.getItem('dp_dialog');
    if (d) $('dialog-input').value = d;
  } catch (e) {}
  ['shu', 'maya'].forEach(w => $(`${w}-rate-val`).textContent = getRate(w).toFixed(2) + '×');
  $('pause-val').textContent = pauseInterval.toFixed(1) + 's';
}

function getRate(w) { return parseFloat($(`${w}-rate`).value); }
function getVoice(w) { return $(`${w}-voice`).value; }

['shu', 'maya'].forEach(w => {
  $(`${w}-rate`).addEventListener('input', e => {
    const r = parseFloat(e.target.value);
    $(`${w}-rate-val`).textContent = r.toFixed(2) + '×';
    // Applies instantly — no re-fetch needed
    if (segment && segment.kind === 'turn' && turns[segment.idx] && who(turns[segment.idx]) === w) {
      player.playbackRate = r;
    }
    saveSettings();
    if (turns.length) recalc();
  });
  $(`${w}-voice`).addEventListener('change', () => {
    saveSettings();
    if (!turns.length) return;
    refreshDownloadButtons();
    warmFromDB();
  });
});

$('pause-slider').addEventListener('input', e => {
  pauseInterval = parseFloat(e.target.value);
  $('pause-val').textContent = pauseInterval.toFixed(1) + 's';
  saveSettings();
  if (turns.length) recalc();
});

// ═══════════════════════════════════════════
//  Countdown
// ═══════════════════════════════════════════
function baseDur(t) {
  const c = mem.get(clipKey(t));
  return c ? c.dur : wordEstimate(t.text);
}
function turnWallSec(i) {
  const t = turns[i];
  const s = baseDur(t) / getRate(who(t));
  return isMine(i) ? Math.max(ROLE_MIN, s * ROLE_FACTOR) : s;
}
function calcTotalSec() {
  let total = 0;
  turns.forEach((t, i) => { total += turnWallSec(i) + pauseInterval; });
  return total;
}
function buildTurnRemainCache() {
  turnRemainCache = [];
  let remain = totalEstSec;
  turns.forEach((t, i) => {
    turnRemainCache.push(remain);
    remain -= turnWallSec(i) + pauseInterval;
  });
}
function recalc() {
  totalEstSec = calcTotalSec();
  buildTurnRemainCache();
  if (!countdownRunning) remainSec = turnRemainCache[currentIdx] ?? totalEstSec;
  $('status-total').textContent = fmtTime(totalEstSec).replace('-', '') + ' total';
  updateCountdownDisplay();
}
function fmtTime(sec) {
  const s = Math.max(0, Math.ceil(sec));
  return `-${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
function startCountdown() {
  if (countdownRunning) return;
  countdownRunning = true;
  countdownTimer = setInterval(() => { remainSec = Math.max(0, remainSec - 0.1); updateCountdownDisplay(); }, 100);
}
function pauseCountdown() {
  countdownRunning = false;
  clearInterval(countdownTimer);
  countdownTimer = null;
}
function resetCountdown() { pauseCountdown(); remainSec = totalEstSec; updateCountdownDisplay(); }
function updateCountdownDisplay() {
  const el = $('status-countdown');
  if (!el || totalEstSec === 0) return;
  el.textContent = fmtTime(remainSec);
  el.classList.toggle('near-end', remainSec <= 10 && countdownRunning);
}

// ═══════════════════════════════════════════
//  Dialog parsing & rendering
// ═══════════════════════════════════════════
function parseDialog(text) {
  return text.trim().split('\n')
    .map(line => line.match(/^(Shu|Maya)\s*:\s*(.+)/i))
    .filter(Boolean)
    .map(m => ({ speaker: m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase(), text: m[2].trim() }));
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderTurns() {
  const list = $('turn-list');
  list.innerHTML = '';
  turns.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = `turn ${who(t)}${isMine(i) ? ' mine' : ''}`;
    div.dataset.idx = i;
    const fname = `turn_${String(i + 1).padStart(2, '0')}_${who(t)}.mp3`;
    div.innerHTML = `
      <div class="turn-header">
        <span class="turn-speaker">${t.speaker}</span>
        ${isMine(i) ? '<span class="you-tag">YOU</span>' : ''}
        <span class="speak-now">🎙 speak now</span>
        <span class="turn-num">#${i + 1}</span>
      </div>
      <div class="turn-text">${hideText ? '・・・' : escHtml(t.text)}</div>
      <div class="turn-footer">
        <a class="dl-btn" data-idx="${i}" download="${fname}">↓ mp3</a>
      </div>
      <div class="playing-bar"></div>`;
    div.addEventListener('click', e => {
      if (e.target.closest('.dl-btn')) return;
      unlock();
      run(i);
    });
    list.appendChild(div);
  });
  refreshDownloadButtons();
}

function refreshDownloadButtons() {
  document.querySelectorAll('.dl-btn').forEach(btn => {
    const t = turns[parseInt(btn.dataset.idx)];
    const clip = t && mem.get(clipKey(t));
    if (clip) { btn.href = clip.url; btn.classList.add('ready'); }
    else { btn.removeAttribute('href'); btn.classList.remove('ready'); }
  });
}

function highlightTurn(idx, scroll = true) {
  document.querySelectorAll('.turn').forEach((el, i) => {
    el.classList.toggle('playing', i === idx);
    if (i !== idx) el.classList.remove('yours-now');
    const bar = el.querySelector('.playing-bar');
    if (bar) bar.style.width = '0%';
  });
  if (scroll) scrollToTurn(idx);
}

function scrollToTurn(idx) {
  const container = $('turn-scroll');
  const el = document.querySelector(`.turn[data-idx="${idx}"]`);
  if (!el || !container) return;
  container.scrollTo({ top: el.offsetTop - container.offsetTop - 8, behavior: 'smooth' });
}

function setYoursNow(idx, on) {
  const el = document.querySelector(`.turn[data-idx="${idx}"]`);
  if (el) el.classList.toggle('yours-now', on);
}

// Progress bar on the current card
(function tick() {
  requestAnimationFrame(tick);
  if (!segment || document.hidden) return;
  const bar = document.querySelector(`.turn[data-idx="${segment.idx}"] .playing-bar`);
  if (!bar) return;
  if (segment.kind === 'gap') { bar.style.width = '100%'; return; }
  const d = player.duration;
  if (d && isFinite(d)) bar.style.width = Math.min(100, player.currentTime / d * 100) + '%';
})();

// ═══════════════════════════════════════════
//  Playback engine
//  One <audio> element plays everything (turns, gaps, your-turn silences)
//  and chains via 'ended' events — no timers — so it keeps going with the screen off.
// ═══════════════════════════════════════════
const CANCEL = Symbol('cancel');
function alive(id) { if (id !== runId) throw CANCEL; }

function setPitch() {
  player.preservesPitch = true;
  player.webkitPreservesPitch = true;
  player.mozPreservesPitch = true;
}

function stopPlayer() {
  ignorePauseUntil = performance.now() + 600;
  player.onended = player.onerror = null;
  if (!player.paused) player.pause();
  segment = null;
}

function halt() {
  runId++;
  running = false;
  if (cancelSeg) { const c = cancelSeg; cancelSeg = null; c(); }
  stopPlayer();
  pauseCountdown();
}

function playSeg(url, rate, id, seg) {
  return new Promise((resolve, reject) => {
    cancelSeg = () => reject(CANCEL);
    ignorePauseUntil = performance.now() + 600;
    segment = seg;
    player.onended = () => { if (id === runId) { cancelSeg = null; resolve(); } };
    player.onerror = () => { if (id === runId) { cancelSeg = null; reject(new Error('Playback error')); } };
    player.src = url;
    player.defaultPlaybackRate = rate;
    player.playbackRate = rate;
    setPitch();
    player.play().then(() => {
      if (id !== runId) return;
      setPlayState('playing');
      startCountdown();
      setMsState('playing');
    }).catch(err => { if (id === runId) { cancelSeg = null; reject(err); } });
  });
}

async function gap(id) {
  if (pauseInterval <= 0) return;
  await playSeg(silenceUrl(pauseInterval), 1, id, { kind: 'gap', idx: currentIdx });
  alive(id);
}

function prefetchAhead(idx) {
  if (!autoPlay) return;
  for (let j = idx + 1; j <= idx + 3 && j < turns.length; j++) {
    const t = turns[j];
    if (mem.has(clipKey(t))) continue;
    getClip(t).then(() => { refreshDownloadButtons(); recalc(); }).catch(() => {});
  }
}

async function playTurnOnce(idx, id) {
  currentIdx = idx;
  highlightTurn(idx, !document.hidden);
  updateStatus();
  setMediaMeta(idx);
  if (turnRemainCache.length > idx) { remainSec = turnRemainCache[idx]; updateCountdownDisplay(); }

  const t = turns[idx];
  let clip = mem.get(clipKey(t));
  if (!clip) {
    setPlayState('loading');
    pauseCountdown();
    clip = await getClip(t);
    alive(id);
    refreshDownloadButtons();
    recalc();
    remainSec = turnRemainCache[idx] ?? remainSec;
  }
  prefetchAhead(idx);

  const rate = getRate(who(t));
  if (isMine(idx)) {
    setYoursNow(idx, true);
    updateStatus('🎙 Your turn');
    const wall = Math.max(ROLE_MIN, clip.dur / rate * ROLE_FACTOR);
    await playSeg(silenceUrl(wall), 1, id, { kind: 'yours', idx });
    setYoursNow(idx, false);
  } else {
    await playSeg(clip.url, rate, id, { kind: 'turn', idx });
  }
  alive(id);
}

async function run(startIdx) {
  if (!turns.length) return;
  halt();
  const id = runId;
  running = true;
  finished = false;
  currentIdx = Math.max(0, Math.min(turns.length - 1, startIdx));
  try {
    for (;;) {
      let rep = 0;
      for (;;) {
        await playTurnOnce(currentIdx, id);
        rep++;
        const maxRep = repeatMode === 999 ? Infinity : repeatMode;
        if (rep >= maxRep) break;
        await gap(id);
      }
      if (!autoPlay) break;
      if (currentIdx + 1 >= turns.length) { finished = true; break; }
      await gap(id);
      currentIdx++;
    }
    // Reached the end normally
    running = false;
    segment = null;
    pauseCountdown();
    setPlayState('stopped');
    setMsState('paused');
    if (finished) { remainSec = 0; updateCountdownDisplay(); updateStatus('finished'); }
    else updateStatus();
  } catch (e) {
    if (e === CANCEL) return;
    running = false;
    segment = null;
    stopPlayer();
    pauseCountdown();
    setPlayState('stopped');
    setMsState('paused');
    updateStatus(`Error: ${e.message || e}`);
    if (/key|401|auth|incorrect/i.test(String(e.message))) {
      keySection.classList.add('error');
      keyStatus.textContent = '!';
    }
  }
}

function pauseNow() {
  halt();
  setPlayState('stopped');
  setMsState('paused');
  updateStatus('paused');
}

function togglePlay() {
  if (!turns.length) return;
  if (running) pauseNow();
  else run(finished ? 0 : currentIdx);
}
function prevTurn() { if (turns.length) run(Math.max(0, currentIdx - 1)); }
function nextTurn() { if (turns.length) run(Math.min(turns.length - 1, currentIdx + 1)); }

// iOS: "unlock" the shared player inside the tap so later play() calls are allowed
function unlock() {
  if (unlocked) return;
  unlocked = true;
  try {
    player.src = silenceUrl(0.1);
    const p = player.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

// Paused by the OS (call, headphones unplugged, etc.)
player.addEventListener('pause', () => {
  if (running && !player.ended && performance.now() > ignorePauseUntil) pauseNow();
});

function setPlayState(state) {
  $('play-icon').style.display    = state === 'stopped' ? 'block' : 'none';
  $('pause-icon').style.display   = state === 'playing' ? 'block' : 'none';
  $('loading-icon').style.display = state === 'loading' ? 'block' : 'none';
  $('play-btn').classList.toggle('loading', state === 'loading');
}

// ═══════════════════════════════════════════
//  Lock screen / notification controls (Media Session)
// ═══════════════════════════════════════════
function setMediaMeta(i) {
  if (!('mediaSession' in navigator) || !window.MediaMetadata) return;
  const t = turns[i];
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: hideText ? `Turn ${i + 1} / ${turns.length}` : t.text.slice(0, 100),
      artist: isMine(i) ? `${t.speaker} — your turn` : t.speaker,
      album: `Dialog Player · ${i + 1}/${turns.length}`
    });
  } catch (e) {}
}
function setMsState(s) {
  try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = s; } catch (e) {}
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const handlers = {
    play: () => { if (!running) run(finished ? 0 : currentIdx); },
    pause: () => { if (running) pauseNow(); },
    stop: () => { if (running) pauseNow(); },
    previoustrack: prevTurn,
    nexttrack: nextTurn,
  };
  for (const [action, fn] of Object.entries(handlers)) {
    try { ms.setActionHandler(action, fn); } catch (e) {}
  }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && turns.length && (running || segment)) highlightTurn(currentIdx);
});

// ═══════════════════════════════════════════
//  Buttons
// ═══════════════════════════════════════════
$('load-btn').addEventListener('click', () => {
  const raw = $('dialog-input').value;
  const newTurns = parseDialog(raw);
  if (!newTurns.length) { alert('No turns found.\nFormat: Shu: ... or Maya: ...'); return; }
  halt();
  setPlayState('stopped');
  try { localStorage.setItem('dp_dialog', raw); } catch (e) {}
  turns = newTurns;
  currentIdx = 0;
  finished = false;
  renderTurns();
  $('empty-state').style.display = 'none';
  $('input-section').style.display = 'none';
  $('load-btn').style.display = 'none';
  $('edit-btn').classList.add('visible');
  $('player-section').classList.add('visible');
  $('turn-count-label').textContent = `${turns.length} turns`;
  recalc();
  resetCountdown();
  updateStatus();
  scrollToTurn(0);
  warmFromDB();
});

$('play-btn').addEventListener('click', () => { unlock(); togglePlay(); });
$('prev-btn').addEventListener('click', () => { unlock(); prevTurn(); });
$('next-btn').addEventListener('click', () => { unlock(); nextTurn(); });

$('repeat-btn').addEventListener('click', () => {
  if (repeatMode === 1) repeatMode = 3;
  else if (repeatMode === 3) repeatMode = 999;
  else repeatMode = 1;
  const btn = $('repeat-btn');
  btn.textContent = repeatMode === 999 ? 'Repeat ∞' : `Repeat ×${repeatMode}`;
  btn.classList.toggle('on', repeatMode !== 1);
});

function setAuto(on) {
  autoPlay = on;
  $('auto-btn').classList.toggle('on', autoPlay);
}
$('auto-btn').addEventListener('click', () => setAuto(!autoPlay));

$('hide-btn').addEventListener('click', () => {
  hideText = !hideText;
  const btn = $('hide-btn');
  btn.textContent = hideText ? 'Hide text' : 'Show text';
  btn.classList.toggle('on', hideText);
  if (!turns.length) return;
  renderTurns();
  if (running || segment) highlightTurn(currentIdx, false);
  setMediaMeta(currentIdx);
});

$('role-btn').addEventListener('click', () => {
  role = role === null ? 'Shu' : role === 'Shu' ? 'Maya' : null;
  const btn = $('role-btn');
  btn.textContent = role ? `Role: ${role}` : 'Role: off';
  btn.classList.toggle('on', !!role);
  btn.classList.toggle('shu', role === 'Shu');
  btn.classList.toggle('maya', role === 'Maya');
  if (role && !autoPlay) setAuto(true);   // roleplay only makes sense as a flowing conversation
  if (!turns.length) return;
  renderTurns();
  if (running || segment) highlightTurn(currentIdx, false);
  recalc();
});

$('edit-btn').addEventListener('click', () => {
  $('input-section').style.display = '';
  $('load-btn').style.display = '';
  $('edit-btn').classList.remove('visible');
  $('player-section').classList.remove('visible');
  $('empty-state').style.display = 'none';
  updateCacheInfo();
});

function updateStatus(msg) {
  const left = $('status-left');
  if (!left) return;
  if (typeof msg === 'string') { left.textContent = msg; return; }
  if (!turns.length) { left.textContent = '—'; return; }
  left.textContent = `${currentIdx + 1} / ${turns.length}  ·  ${turns[currentIdx].speaker}`;
}

// ═══════════════════════════════════════════
//  Download all → one WAV
//  decode each clip → join with pause gaps → 16-bit PCM WAV
//  With Role on, your lines become silence (roleplay track)
// ═══════════════════════════════════════════
$('dl-all-btn').addEventListener('click', async () => {
  const btn = $('dl-all-btn');
  const prog = $('dl-all-progress');
  if (!turns.length || btn.classList.contains('loading')) return;

  btn.classList.add('loading');
  prog.textContent = `0 / ${turns.length}`;

  const parts = [];   // Float32Array or number (silent samples)
  let firstError = null;

  for (let i = 0; i < turns.length; i++) {
    const t = turns[i];
    try {
      const clip = await getClip(t);
      if (isMine(i)) {
        parts.push(Math.round(Math.max(ROLE_MIN, clip.dur * ROLE_FACTOR) * DECODE_SR));
      } else {
        const ab = await decodeBuf(clip.buf);
        parts.push(ab.getChannelData(0));
      }
      if (i < turns.length - 1 && pauseInterval > 0) parts.push(Math.round(pauseInterval * DECODE_SR));
    } catch (e) {
      console.warn(`Turn ${i + 1} error:`, e.message);
      firstError = firstError || e;
    }
    prog.textContent = `${i + 1} / ${turns.length}`;
  }
  refreshDownloadButtons();

  const frames = parts.reduce((s, p) => s + (typeof p === 'number' ? p : p.length), 0);
  if (!frames) {
    btn.classList.remove('loading');
    prog.textContent = '';
    updateStatus(`Error: ${firstError ? firstError.message : 'no audio'}`);
    return;
  }
  const out = new ArrayBuffer(44 + frames * 2);
  const view = new DataView(out);
  writeWavHeader(view, frames, DECODE_SR);
  let off = 44;
  for (const p of parts) {
    if (typeof p === 'number') { off += p * 2; continue; }
    for (let k = 0; k < p.length; k++) {
      const s = Math.max(-1, Math.min(1, p[k]));
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      off += 2;
    }
  }

  const url = URL.createObjectURL(new Blob([out], { type: 'audio/wav' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = role ? `dialog_roleplay_${role.toLowerCase()}.wav` : 'dialog.wav';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);

  btn.classList.remove('loading');
  prog.textContent = '';
});

// ═══════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════
loadSettings();
updateCacheInfo();
</script>
