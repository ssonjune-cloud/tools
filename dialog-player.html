<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dialog Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap');

  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface2: #22222a;
    --border: #2e2e38;
    --shu: #7eb8f7;
    --shu-dim: rgba(126,184,247,0.12);
    --maya: #f7a87e;
    --maya-dim: rgba(247,168,126,0.12);
    --text: #e8e8f0;
    --muted: #666676;
    --accent: #c8f76e;
    --error: #f77e7e;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─── Header ─── */
  header {
    padding: 16px 20px 0;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 1.4rem;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  header span {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ─── API Key ─── */
  #api-key-section {
    margin: 12px 16px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  #api-key-section:focus-within { border-color: var(--accent); }
  #api-key-section.valid { border-color: rgba(200,247,110,0.4); }
  #api-key-section.error { border-color: var(--error); }

  .api-key-inner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
  }
  .api-key-label {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #api-key-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    min-width: 0;
  }
  #api-key-status {
    font-size: 0.65rem;
    flex-shrink: 0;
  }

  /* ─── Input Area ─── */
  #input-section {
    margin: 10px 16px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  #input-section:focus-within { border-color: var(--accent); }

  #input-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px 7px;
    border-bottom: 1px solid var(--border);
  }
  #input-label span {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    line-height: 1.7;
    padding: 10px 14px;
    resize: none;
    min-height: 100px;
  }
  textarea::placeholder { color: var(--muted); }

  #load-btn {
    display: block;
    width: calc(100% - 32px);
    margin: 8px 16px 12px;
    padding: 13px;
    background: var(--accent);
    color: #0f0f11;
    border: none;
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  #load-btn:active { opacity: 0.8; transform: scale(0.98); }
  #load-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ─── Voice Settings ─── */
  #voice-settings {
    margin: 0 16px 8px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex-shrink: 0;
  }
  .voice-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }
  .voice-card.shu { border-left: 3px solid var(--shu); }
  .voice-card.maya { border-left: 3px solid var(--maya); }
  .voice-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .voice-card.shu .voice-label { color: var(--shu); }
  .voice-card.maya .voice-label { color: var(--maya); }
  select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    padding: 6px 8px;
    outline: none;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .rate-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .rate-row span { font-size: 0.65rem; color: var(--muted); }
  .rate-row input[type=range] {
    flex: 1;
    height: 3px;
    -webkit-appearance: none;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  .voice-card.shu .rate-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--shu);
    border-radius: 50%;
    cursor: pointer;
  }
  .voice-card.maya .rate-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--maya);
    border-radius: 50%;
    cursor: pointer;
  }
  .rate-val { min-width: 28px; font-size: 0.65rem; color: var(--muted); text-align: right; }

  /* ─── Playback Controls ─── */
  #controls {
    margin: 0;
    background: transparent;
    border: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .ctrl-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .btn-icon {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn-icon:active { transform: scale(0.92); }
  .btn-icon svg { width: 18px; height: 18px; }
  .btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }

  #play-btn {
    width: 60px; height: 60px;
    background: var(--accent);
    border-color: transparent;
    color: #0f0f11;
  }
  #play-btn svg { width: 24px; height: 24px; }
  #play-btn.loading {
    background: var(--surface2);
    border-color: var(--border);
    color: var(--text);
    animation: pulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

  .toggle-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .toggle-btn.on {
    background: var(--accent);
    border-color: transparent;
    color: #0f0f11;
  }

  .ctrl-row-small {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .pause-row {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
  }
  .pause-row label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .pause-row input[type=range] {
    width: 100px; height: 3px;
    -webkit-appearance: none;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  .pause-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }
  .pause-val { font-size: 0.65rem; color: var(--muted); min-width: 28px; }

  /* ─── Scrollable turn area ─── */
  #turn-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 16px 16px;
  }

  /* ─── Turn List ─── */
  #turn-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ─── Bottom fixed panel ─── */
  #bottom-panel {
    flex-shrink: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 10px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .turn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }
  .turn:active { opacity: 0.85; }
  .turn.shu { border-left: 3px solid var(--shu); }
  .turn.maya { border-left: 3px solid var(--maya); }
  .turn.playing.shu { background: var(--shu-dim); border-color: var(--shu); }
  .turn.playing.maya { background: var(--maya-dim); border-color: var(--maya); }
  .turn.loading-audio { opacity: 0.6; }

  .turn-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .turn-speaker {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .turn.shu .turn-speaker { color: var(--shu); }
  .turn.maya .turn-speaker { color: var(--maya); }
  .turn-num { font-size: 0.6rem; color: var(--muted); margin-left: auto; }
  .turn-text { font-size: 0.82rem; line-height: 1.7; color: var(--text); }

  .dl-btn {
    display: none;
    align-items: center;
    gap: 4px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    flex-shrink: 0;
    text-decoration: none;
  }
  .dl-btn.ready { display: flex; }
  .dl-btn:active { color: var(--accent); border-color: var(--accent); }

  .playing-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    background: var(--accent);
    width: 0%;
  }
  .turn.playing .playing-bar { animation: progress-pulse 1s ease-in-out infinite alternate; }
  @keyframes progress-pulse { from { opacity: 0.5; } to { opacity: 1; } }

  /* ─── Status bar ─── */
  #status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.06em;
  }
  #status-countdown {
    font-size: 0.9rem;
    color: var(--text);
    letter-spacing: 0.04em;
    transition: color 0.3s;
  }
  #status-countdown.near-end { color: var(--maya); }
  #status-total { font-size: 0.6rem; color: var(--muted); }

  /* ─── Empty state ─── */
  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 40px 20px;
    color: var(--muted);
  }
  #empty-state .big { font-size: 2.5rem; }
  #empty-state p { font-size: 0.72rem; text-align: center; line-height: 1.8; }

  #player-section { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
  #player-section.visible { display: flex; }
</style>
</head>
<body>

<header>
  <h1>Dialog Player</h1>
  <span>shadowing / listening</span>
</header>

<!-- API Key -->
<div id="api-key-section">
  <div class="api-key-inner">
    <span class="api-key-label">OpenAI Key</span>
    <input type="password" id="api-key-input" placeholder="sk-..." autocomplete="off" spellcheck="false">
    <span id="api-key-status">—</span>
  </div>
</div>

<!-- Input -->
<div id="input-section">
  <div id="input-label">
    <span>Paste dialog</span>
    <span id="turn-count-label"></span>
  </div>
  <textarea id="dialog-input" placeholder="Shu: Hello, how's it going?&#10;Maya: Pretty good! I just finished the report.&#10;Shu: Oh nice, when did you finish it?"></textarea>
</div>
<button id="load-btn">Load Dialog ↓</button>

<!-- Player -->
<div id="player-section">

  <!-- Voice settings -->
  <div id="voice-settings">
    <div class="voice-card shu">
      <div class="voice-label">Shu</div>
      <select id="shu-voice">
        <option value="onyx">onyx</option>
        <option value="echo">echo</option>
        <option value="fable">fable</option>
        <option value="alloy">alloy</option>
        <option value="nova">nova</option>
        <option value="shimmer">shimmer</option>
      </select>
      <div class="rate-row">
        <span>Speed</span>
        <input type="range" id="shu-rate" min="0.5" max="1.5" step="0.05" value="0.9">
        <span class="rate-val" id="shu-rate-val">0.90×</span>
      </div>
    </div>
    <div class="voice-card maya">
      <div class="voice-label">Maya</div>
      <select id="maya-voice">
        <option value="shimmer">shimmer</option>
        <option value="nova">nova</option>
        <option value="alloy">alloy</option>
        <option value="fable">fable</option>
        <option value="echo">echo</option>
        <option value="onyx">onyx</option>
      </select>
      <div class="rate-row">
        <span>Speed</span>
        <input type="range" id="maya-rate" min="0.5" max="1.5" step="0.05" value="0.9">
        <span class="rate-val" id="maya-rate-val">0.90×</span>
      </div>
    </div>
  </div>

  <!-- Scrollable turn list -->
  <div id="turn-scroll">
    <div id="turn-list"></div>
  </div>

  <!-- Bottom fixed controls -->
  <div id="bottom-panel">
    <div id="status-bar">
      <span id="status-left">—</span>
      <span id="status-countdown">—</span>
      <span id="status-total"></span>
    </div>
    <div id="controls">
      <div class="ctrl-row">
        <button class="btn-icon" id="prev-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="btn-icon" id="play-btn">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <svg id="loading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="10" stroke-dasharray="40" stroke-dashoffset="10"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/></circle></svg>
        </button>
        <button class="btn-icon" id="next-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="ctrl-row-small">
        <button class="toggle-btn" id="repeat-btn">Repeat ×1</button>
        <button class="toggle-btn" id="auto-btn">Auto</button>
        <button class="toggle-btn" id="hide-btn">Show text</button>
      </div>
      <div class="pause-row">
        <label>Pause</label>
        <input type="range" id="pause-slider" min="0" max="4" step="0.5" value="1">
        <span class="pause-val" id="pause-val">1.0s</span>
      </div>
    </div>
  </div>

</div>

<div id="empty-state">
  <div class="big">🎧</div>
  <p>Enter your OpenAI API key above,<br>paste your Shu / Maya dialog,<br>and tap <strong>Load Dialog</strong></p>
</div>

<script>
// ── State ──
let turns = [];
let audioCache = {};   // idx -> AudioBuffer or 'loading' or 'error'
let currentIdx = 0;
let isPlaying = false;
let repeatMode = 1;
let autoPlay = false;
let hideText = false;
let pauseInterval = 1.0;
let repeatCount = 0;
let autoTimer = null;
let currentAudio = null;

// ── Countdown ──
let totalEstSec = 0;
let remainSec = 0;
let countdownTimer = null;
let countdownRunning = false;
let turnRemainCache = [];

// ── API Key ──
let apiKey = sessionStorage.getItem('oai_key') || '';

const keyInput = document.getElementById('api-key-input');
const keyStatus = document.getElementById('api-key-status');
const keySection = document.getElementById('api-key-section');

if (apiKey) {
  keyInput.value = apiKey;
  keyStatus.textContent = '✓';
  keySection.classList.add('valid');
}

keyInput.addEventListener('input', e => {
  apiKey = e.target.value.trim();
  sessionStorage.setItem('oai_key', apiKey);
  if (apiKey.startsWith('sk-') && apiKey.length > 20) {
    keyStatus.textContent = '✓';
    keySection.classList.remove('error');
    keySection.classList.add('valid');
  } else {
    keyStatus.textContent = '—';
    keySection.classList.remove('valid', 'error');
  }
  audioCache = {}; // キー変更時にキャッシュクリア
});

// ── OpenAI TTS ──
async function fetchTTS(text, voice, speed) {
  const res = await fetch('https://api.openai.com/v1/audio/speech', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${apiKey}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      model: 'tts-1',
      input: text,
      voice: voice,
      speed: speed
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${res.status}`);
  }
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

// ── Rate sliders ──
['shu','maya'].forEach(who => {
  document.getElementById(`${who}-rate`).addEventListener('input', e => {
    document.getElementById(`${who}-rate-val`).textContent = parseFloat(e.target.value).toFixed(2) + '×';
    audioCache = {}; // 速度変更でキャッシュ無効化
    if (turns.length) {
      totalEstSec = calcTotalSec();
      buildTurnRemainCache();
      if (!countdownRunning) remainSec = turnRemainCache[currentIdx] ?? totalEstSec;
      document.getElementById('status-total').textContent = fmtTime(totalEstSec).replace('-','') + ' total';
      updateCountdownDisplay();
    }
  });
});

// ── Pause slider ──
document.getElementById('pause-slider').addEventListener('input', e => {
  pauseInterval = parseFloat(e.target.value);
  document.getElementById('pause-val').textContent = pauseInterval.toFixed(1) + 's';
  if (turns.length) {
    totalEstSec = calcTotalSec();
    buildTurnRemainCache();
    if (!countdownRunning) remainSec = turnRemainCache[currentIdx] ?? totalEstSec;
    document.getElementById('status-total').textContent = fmtTime(totalEstSec).replace('-','') + ' total';
    updateCountdownDisplay();
  }
});

// ── Countdown ──
function estimateTurnSec(text, rate) {
  const words = text.trim().split(/\s+/).length;
  return (words / (150 * rate)) * 60;
}
function calcTotalSec() {
  let total = 0;
  turns.forEach(t => {
    total += estimateTurnSec(t.text, getRate(t.speaker.toLowerCase()));
    total += pauseInterval;
  });
  return total;
}
function buildTurnRemainCache() {
  turnRemainCache = [];
  let remain = totalEstSec;
  turns.forEach(t => {
    turnRemainCache.push(remain);
    remain -= estimateTurnSec(t.text, getRate(t.speaker.toLowerCase()));
    remain -= pauseInterval;
  });
}
function fmtTime(sec) {
  const s = Math.max(0, Math.ceil(sec));
  return `-${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function startCountdown() {
  if (countdownRunning) return;
  countdownRunning = true;
  countdownTimer = setInterval(() => {
    remainSec = Math.max(0, remainSec - 0.1);
    updateCountdownDisplay();
  }, 100);
}
function pauseCountdown() {
  countdownRunning = false;
  clearInterval(countdownTimer);
  countdownTimer = null;
}
function resetCountdown() {
  pauseCountdown();
  remainSec = totalEstSec;
  updateCountdownDisplay();
}
function updateCountdownDisplay() {
  const el = document.getElementById('status-countdown');
  if (!el || totalEstSec === 0) return;
  el.textContent = fmtTime(remainSec);
  el.classList.toggle('near-end', remainSec <= 10 && countdownRunning);
}

// ── Parse dialog ──
function parseDialog(text) {
  return text.trim().split('\n')
    .map(line => line.match(/^(Shu|Maya)\s*:\s*(.+)/i))
    .filter(Boolean)
    .map(m => ({ speaker: m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase(), text: m[2].trim() }));
}

// ── Render turns ──
function renderTurns() {
  const list = document.getElementById('turn-list');
  list.innerHTML = '';
  turns.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = `turn ${t.speaker.toLowerCase()}`;
    div.dataset.idx = i;
    div.innerHTML = `
      <div class="turn-header">
        <span class="turn-speaker">${t.speaker}</span>
        <a class="dl-btn" data-idx="${i}" download="turn_${String(i+1).padStart(2,'0')}_${t.speaker.toLowerCase()}.mp3">↓ mp3</a>
        <span class="turn-num">#${i+1}</span>
      </div>
      <div class="turn-text">${hideText ? '・・・' : escHtml(t.text)}</div>
      <div class="playing-bar"></div>`;
    div.addEventListener('click', e => {
      if (e.target.closest('.dl-btn')) return; // ダウンロードボタンは再生しない
      jumpTo(i);
    });
    list.appendChild(div);
  });
  // すでにキャッシュ済みのターンはボタンを即表示
  refreshDownloadButtons();
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// キャッシュ済みターンのダウンロードボタンを有効化
function refreshDownloadButtons() {
  document.querySelectorAll('.dl-btn').forEach(btn => {
    const idx = parseInt(btn.dataset.idx);
    const t = turns[idx];
    const who = t.speaker.toLowerCase();
    const cacheKey = `${idx}_${getVoice(who)}_${getRate(who)}`;
    const url = audioCache[cacheKey];
    if (url && url !== 'error') {
      btn.href = url;
      btn.classList.add('ready');
    } else {
      btn.classList.remove('ready');
    }
  });
}

// ── Load button ──
document.getElementById('load-btn').addEventListener('click', () => {
  if (!apiKey || !apiKey.startsWith('sk-')) {
    keySection.classList.add('error');
    keyStatus.textContent = '!';
    keyInput.focus();
    return;
  }
  const raw = document.getElementById('dialog-input').value;
  turns = parseDialog(raw);
  if (!turns.length) { alert('No turns found.\nFormat: Shu: ... or Maya: ...'); return; }
  audioCache = {};
  currentIdx = 0;
  repeatCount = 0;
  renderTurns();
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('player-section').classList.add('visible');
  document.getElementById('turn-count-label').textContent = `${turns.length} turns`;
  totalEstSec = calcTotalSec();
  buildTurnRemainCache();
  resetCountdown();
  document.getElementById('status-total').textContent = fmtTime(totalEstSec).replace('-','') + ' total';
  updateStatus();
  scrollToTurn(0);
});

// ── Playback ──
function getRate(who) {
  return parseFloat(document.getElementById(`${who}-rate`).value);
}
function getVoice(who) {
  return document.getElementById(`${who}-voice`).value;
}

async function playTurn(idx) {
  stopAudio();
  clearTimeout(autoTimer);
  pauseCountdown();
  if (idx < 0 || idx >= turns.length) return;
  currentIdx = idx;

  if (turnRemainCache.length > idx) {
    remainSec = turnRemainCache[idx];
    updateCountdownDisplay();
  }
  highlightTurn(idx);
  updateStatus();

  const t = turns[idx];
  const who = t.speaker.toLowerCase();
  const cacheKey = `${idx}_${getVoice(who)}_${getRate(who)}`;

  setPlayState('loading');

  let audioUrl;
  try {
    if (audioCache[cacheKey] && audioCache[cacheKey] !== 'error') {
      audioUrl = audioCache[cacheKey];
    } else {
      audioUrl = await fetchTTS(t.text, getVoice(who), getRate(who));
      audioCache[cacheKey] = audioUrl;
      refreshDownloadButtons();
    }
  } catch(e) {
    audioCache[cacheKey] = 'error';
    setPlayState('stopped');
    updateStatus(`Error: ${e.message}`);
    keySection.classList.add('error');
    return;
  }

  const audio = new Audio(audioUrl);
  currentAudio = audio;

  audio.onplay = () => { setPlayState('playing'); startCountdown(); };
  audio.onended = () => { setPlayState('stopped'); handleEnd(); };
  audio.onerror = () => { setPlayState('stopped'); handleEnd(); };

  audio.play().catch(e => {
    setPlayState('stopped');
    updateStatus(`Playback error`);
  });
}

function stopAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.onplay = null;
    currentAudio.onended = null;
    currentAudio.onerror = null;
    currentAudio = null;
  }
}

function handleEnd() {
  const maxRepeat = repeatMode === 999 ? Infinity : repeatMode;
  repeatCount++;
  if (repeatCount < maxRepeat) {
    autoTimer = setTimeout(() => playTurn(currentIdx), pauseInterval * 1000);
  } else {
    repeatCount = 0;
    if (autoPlay) {
      if (currentIdx + 1 < turns.length) {
        autoTimer = setTimeout(() => playTurn(currentIdx + 1), pauseInterval * 1000);
      } else {
        pauseCountdown();
        remainSec = 0;
        updateCountdownDisplay();
        updateStatus('finished');
        isPlaying = false;
      }
    } else {
      pauseCountdown();
      isPlaying = false;
      updateStatus();
    }
  }
}

function setPlayState(state) {
  const btn = document.getElementById('play-btn');
  document.getElementById('play-icon').style.display   = state === 'stopped'  ? 'block' : 'none';
  document.getElementById('pause-icon').style.display  = state === 'playing'  ? 'block' : 'none';
  document.getElementById('loading-icon').style.display= state === 'loading'  ? 'block' : 'none';
  btn.classList.toggle('loading', state === 'loading');
  isPlaying = state === 'playing';
}

function highlightTurn(idx) {
  document.querySelectorAll('.turn').forEach((el, i) => {
    el.classList.toggle('playing', i === idx);
  });
  scrollToTurn(idx);
}

function scrollToTurn(idx) {
  const container = document.getElementById('turn-scroll');
  const el = document.querySelector(`.turn[data-idx="${idx}"]`);
  if (!el || !container) return;
  container.scrollTo({ top: el.offsetTop - container.offsetTop - 8, behavior: 'smooth' });
}

function jumpTo(idx) {
  repeatCount = 0;
  isPlaying = true;
  playTurn(idx);
}

// ── Controls ──
document.getElementById('play-btn').addEventListener('click', () => {
  if (!turns.length) return;
  if (currentAudio && !currentAudio.paused) {
    stopAudio();
    pauseCountdown();
    setPlayState('stopped');
    document.querySelectorAll('.turn').forEach(el => el.classList.remove('playing'));
    updateStatus('paused');
  } else {
    repeatCount = 0;
    playTurn(currentIdx);
  }
});

document.getElementById('prev-btn').addEventListener('click', () => {
  if (!turns.length) return;
  repeatCount = 0;
  playTurn(Math.max(0, currentIdx - 1));
});

document.getElementById('next-btn').addEventListener('click', () => {
  if (!turns.length) return;
  repeatCount = 0;
  playTurn(Math.min(turns.length - 1, currentIdx + 1));
});

document.getElementById('repeat-btn').addEventListener('click', () => {
  if (repeatMode === 1) repeatMode = 3;
  else if (repeatMode === 3) repeatMode = 999;
  else repeatMode = 1;
  const btn = document.getElementById('repeat-btn');
  btn.textContent = repeatMode === 999 ? 'Repeat ∞' : `Repeat ×${repeatMode}`;
  btn.classList.toggle('on', repeatMode !== 1);
});

document.getElementById('auto-btn').addEventListener('click', () => {
  autoPlay = !autoPlay;
  document.getElementById('auto-btn').classList.toggle('on', autoPlay);
});

document.getElementById('hide-btn').addEventListener('click', () => {
  hideText = !hideText;
  const btn = document.getElementById('hide-btn');
  btn.textContent = hideText ? 'Hide text' : 'Show text';
  btn.classList.toggle('on', hideText);
  if (turns.length) renderTurns();
  if (isPlaying) highlightTurn(currentIdx);
});

function updateStatus(msg) {
  const left = document.getElementById('status-left');
  if (!left) return;
  if (typeof msg === 'string') { left.textContent = msg; return; }
  if (!turns.length) { left.textContent = '—'; return; }
  left.textContent = `${currentIdx + 1} / ${turns.length}  ·  ${turns[currentIdx].speaker}`;
}
</script>
</body>
</html>
